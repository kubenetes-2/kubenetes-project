<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/form.css">
    <script src="/js/storage.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function(){
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', function(e){
          e.preventDefault();
          const data = Object.fromEntries(new FormData(form));
          const r = StorageAPI.login({ id: data.id, password: data.password });
          if (r.ok) {
            location.href = '/';
          } else {
            alert('로그인 실패: ID 또는 비밀번호 확인');
          }
        });
      });
    </script>
  </head>
  <body>
    <header class="banner"><h1>내일의 발견</h1></header>
    <div class="form-card">
      <h2 class="form-title">로그인</h2>
      <form id="loginForm">
        <label>ID</label>
        <input name="id" required>
        <label>비밀번호</label>
        <input name="password" type="password" required>
        <div class="btn-row">
          <button type="submit" style="padding:12px 24px;font-size:1.1rem;">로그인</button>
          <a class="btn" href="/signup.html" style="padding:12px 24px;font-size:1.1rem;display:inline-block;">회원가입</a>
        </div>
      </form>
    </div>
  </body>
  </html>
