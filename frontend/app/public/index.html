<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내일의 발견</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/storage.js"></script>
</head>
<body>
    <header class="banner" style="display:flex;align-items:center;justify-content:flex-end;">
        <h1 class="title-center">내일의 발견</h1>
        <nav id="authNav"></nav>
    </header>

    <main class="dashboard">
        <!-- 왼쪽: 사이드 버튼 -->
        <section class="left-panel" style="max-width:280px;">
            <div class="sidebar-grid">
                <a class="new-post-btn nav-btn" href="/calendar.html">채용 달력</a>
                <a class="new-post-btn nav-btn" href="/search.html">나의 공고찾기</a>
                <a class="new-post-btn nav-btn" href="/history.html">저장내역조회</a>
            </div>
        </section>

        <!-- 오른쪽: 필터 + 리스트 -->
        <section class="right-panel">
            <div class="job-header" style="display:flex;justify-content:space-between;align-items:center;">
                <h2>채용 공고 리스트</h2>
            </div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px;">
                <select id="fCompany"></select>
                <select id="fSize"></select>
                <select id="fRole"></select>
                <select id="fTech"></select>
            </div>
            <table class="job-table" style="margin-top:12px;">
                <thead>
                    <tr>
                        <th>공고명</th>
                        <th>기업명</th>
                        <th>기업규모</th>
                        <th>주소</th>
                        <th>직무</th>
                        <th>기술스택</th>
                        <th>경력</th>
                        <th>연봉 및 급여</th>
                        <th>마감일</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="jobTbody"></tbody>
            </table>
        </section>
    </main>

    <script src="/js/app.js"></script>
    <script src="/js/auth-ui.js"></script>
</body>
</html>
