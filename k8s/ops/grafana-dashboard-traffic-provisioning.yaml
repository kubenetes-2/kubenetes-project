          {
            "id": 5,
            "title": "Total RX Summary",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 16},
            "targets": [
              {
                "expr": "sum(rate(node_network_receive_bytes_total{device!~\"lo|veth.*|docker.*|br.*\"}[5m])) * 8",
                "format": "time_series",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto",
              "reduceOptions": {
                "values": false,
                "calcs": ["lastNotNull"],
                "fields": ""
              },
              "textMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "bps",
                "color": {"mode": "thresholds"},
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": null, "color": "green"},
                    {"value": 1000000000, "color": "yellow"},
                    {"value": 5000000000, "color": "red"}
                  ]
                }
              }
            }
          },
          {
            "id": 6,
