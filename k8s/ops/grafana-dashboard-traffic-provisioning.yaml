                  ]
                }
              }
            }
          },
          {
            "id": 7,
            "title": "Network Packets In",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
            "targets": [
              {
                "expr": "rate(node_network_receive_packets_total{device!~\"lo|veth.*|docker.*|br.*\"}[5m])",
                "legendFormat": "{{node}} ({{device}})",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "pps",
                "custom": {
                  "drawStyle": "line",
                  "lineInterpolation": "linear",
