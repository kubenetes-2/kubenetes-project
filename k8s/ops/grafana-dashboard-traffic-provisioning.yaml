apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-traffic-provisioning
  namespace: ops
  labels:
    app: grafana
data:
  traffic-dashboard.json: |-
    {
        "id": null,
        "uid": "node-traffic-dashboard",
        "title": "Kubernetes Nodes Traffic Monitoring",
        "tags": ["kubernetes", "network", "traffic"],
        "timezone": "browser",
        "schemaVersion": 16,
        "version": 0,
        "refresh": "10s",
        "panels": [
          {
            "id": 1,
            "title": "Network Traffic In (All Nodes)",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "rate(node_network_receive_bytes_total{device!~\"lo|veth.*|docker.*|br.*\"}[5m]) * 8",
                "legendFormat": "{{node}} ({{device}})",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "bps",
                "custom": {
                  "drawStyle": "line",
                  "lineInterpolation": "linear",
                  "barAlignment": 0,
                  "lineWidth": 1,
                  "fillOpacity": 10,
                  "gradientMode": "none",
                  "spanNulls": false,
                  "insertNulls": false,
                  "showPoints": "never",
                  "pointSize": 5,
                  "stacking": {"group": "A", "mode": "none"},
                  "axisPlacement": "auto",
                  "axisLabel": "",
                  "axisColorMode": "text",
                  "scaleDistribution": {"type": "linear"},
                  "hideFrom": {"tooltip": false, "viz": false, "legend": false},
                  "thresholdsStyle": {"mode": "off"}
                },
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": null, "color": "green"},
                    {"value": 1000000000, "color": "yellow"},
                    {"value": 5000000000, "color": "red"}
                  ]
                }
              }
            },
            "options": {
              "tooltip": {"mode": "multi"},
              "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}
            }
          },
          {
            "id": 2,
            "title": "Network Traffic Out (All Nodes)",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|docker.*|br.*\"}[5m]) * 8",
                "legendFormat": "{{node}} ({{device}})",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "bps",
                "custom": {
                  "drawStyle": "line",
                  "lineInterpolation": "linear",
                  "barAlignment": 0,
                  "lineWidth": 1,
                  "fillOpacity": 10,
                  "gradientMode": "none",
                  "spanNulls": false,
                  "insertNulls": false,
                  "showPoints": "never",
                  "pointSize": 5,
                  "stacking": {"group": "A", "mode": "none"},
                  "axisPlacement": "auto",
                  "axisLabel": "",
                  "axisColorMode": "text",
                  "scaleDistribution": {"type": "linear"},
                  "hideFrom": {"tooltip": false, "viz": false, "legend": false},
                  "thresholdsStyle": {"mode": "off"}
                },
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": null, "color": "green"},
                    {"value": 1000000000, "color": "yellow"},
                    {"value": 5000000000, "color": "red"}
                  ]
                }
              }
            },
            "options": {
              "tooltip": {"mode": "multi"},
              "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}
            }
          },
          {
            "id": 3,
            "title": "Master Nodes Traffic",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
            "targets": [
              {
                "expr": "rate(node_network_receive_bytes_total{node=~\"master.*\", device!~\"lo|veth.*|docker.*|br.*\"}[5m]) * 8",
                "legendFormat": "{{node}} RX",
                "refId": "A"
              },
              {
                "expr": "rate(node_network_transmit_bytes_total{node=~\"master.*\", device!~\"lo|veth.*|docker.*|br.*\"}[5m]) * 8",
