apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ops
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/control-plane: "false"
      initContainers:
      - name: copy-dashboards
        image: busybox:1.36
        command: ['sh', '-c']
        args:
        - |
          mkdir -p /var/lib/grafana/dashboards
          cp /etc/grafana/dashboards-provider/*.json /var/lib/grafana/dashboards/ || true
        volumeMounts:
        - name: grafana-dashboards-provider
          mountPath: /etc/grafana/dashboards-provider
        - name: grafana-storage
          mountPath: /var/lib/grafana
      containers:
      - name: grafana
        image: grafana/grafana:10.2.2
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"  # 프로덕션에서는 Secret 사용 권장
        - name: GF_SERVER_ROOT_URL
          value: "/"
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards-provider
          mountPath: /var/lib/grafana/dashboards
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: grafana-storage
        emptyDir: {}
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboard-provisioning
      - name: grafana-dashboards-provider
        configMap:
          name: grafana-dashboard-traffic-provisioning

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ops
  labels:
    app: grafana
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30330
    protocol: TCP
    name: http
  selector:
    app: grafana

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ops
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus.ops.svc.cluster.local:9090
      isDefault: true
      editable: true

