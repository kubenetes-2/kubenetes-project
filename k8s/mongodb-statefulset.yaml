apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: dev-db
  labels:
    app: mongodb
spec:
  serviceName: mongodb-headless
  replicas: 2
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      # Harbor 레지스트리 인증
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: mongodb
        image: 192.168.0.208/proj/mongo:7.0
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_DATABASE
          value: "jobsdb"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: REPLICA_SET_NAME
          value: "rs0"
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          PRIMARY_HOST="mongodb-0.mongodb-headless.${POD_NAMESPACE}.svc.cluster.local:27017"
          SECONDARY_HOST="mongodb-1.mongodb-headless.${POD_NAMESPACE}.svc.cluster.local:27017"

          rm -rf /data/db/reset.lock

          mongod --replSet "${REPLICA_SET_NAME}" --bind_ip_all &
          MONGO_PID=$!

          cleanup() {
            echo "Shutting down mongod..."
            kill -TERM "${MONGO_PID}"
            wait "${MONGO_PID}"
          }
          trap cleanup SIGINT SIGTERM

          until mongosh --quiet --eval "db.adminCommand({ ping: 1 })" >/dev/null 2>&1; do
            sleep 2
          done

          if [[ "${POD_NAME}" == "mongodb-0" ]]; then
            cat <<'EOF' >/tmp/rs-init.js
const rsName = process.env.REPLICA_SET_NAME;
const primaryHost = process.env.PRIMARY_HOST;
const secondaryHost = process.env.SECONDARY_HOST;
const expectedMembers = [
  { _id: 0, host: primaryHost, priority: 2 },
  { _id: 1, host: secondaryHost, priority: 1 }
];

function membersNeedUpdate(currentMembers) {
  if (!Array.isArray(currentMembers) || currentMembers.length !== expectedMembers.length) {
    return true;
  }
  for (const expected of expectedMembers) {
    const match = currentMembers.find(member => member._id === expected._id);
    if (!match) {
      return true;
    }
    const priority = typeof match.priority === 'number' ? match.priority : 1;
    if (match.host !== expected.host || priority !== expected.priority) {
      return true;
    }
  }
  return false;
}

function initReplicaSet() {
  const existingCfg = db.getSiblingDB('local').system.replset.findOne({ _id: rsName });
  if (!existingCfg) {
    print(`[rs-init] first-time initiate with members: ${tojson(expectedMembers)}`);
    return rs.initiate({ _id: rsName, members: expectedMembers });
  }

  print(`[rs-init] existing config detected, forcing reconfig`);
  const nextCfg = Object.assign({}, existingCfg);
  nextCfg.members = expectedMembers;
  nextCfg.version = (existingCfg.version || 1) + 1;
  return rs.reconfig(nextCfg, { force: true });
}

function ensureReplicaSet() {
  try {
    const status = rs.status();
    if (membersNeedUpdate(status.members)) {
      print('[rs-init] status members mismatch, reconfiguring');
      initReplicaSet();
    } else {
      print('[rs-init] replica set already configured as expected');
    }
  } catch (err) {
    if (err.codeName === 'NotYetInitialized' || err.codeName === 'NodeNotFound') {
      print(`[rs-init] status error ${err.codeName}, reconfiguring`);
      initReplicaSet();
    } else if (err.codeName === 'AlreadyInitialized') {
      print('[rs-init] previous state detected, reconfiguring');
      initReplicaSet();
    } else {
      throw err;
    }
  }
}

ensureReplicaSet();
EOF

            PRIMARY_HOST="${PRIMARY_HOST}" SECONDARY_HOST="${SECONDARY_HOST}" REPLICA_SET_NAME="${REPLICA_SET_NAME}" \
            mongosh --quiet --file /tmp/rs-init.js || true

            until mongosh --quiet --eval "rs.status()" >/dev/null 2>&1; do
              sleep 2
            done
            mongosh --quiet --eval "rs.awaitPrimary();" || true
          else
            until mongosh --quiet --host "${PRIMARY_HOST}" --eval "db.adminCommand({ ping: 1 })" >/dev/null 2>&1; do
              sleep 2
            done
            echo "Connected to primary"
          fi

          wait "${MONGO_PID}"
        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
  volumeClaimTemplates:
  - metadata:
      name: mongodb-storage
    spec:
      storageClassName: hostpath
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

