apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: dev-db
  labels:
    app: mongodb
spec:
  serviceName: mongodb-headless
  replicas: 2
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      # Harbor 레지스트리 인증
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: mongodb
        image: 192.168.0.208/proj/mongo:7.0
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_DATABASE
          value: "jobsdb"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: REPLICA_SET_NAME
          value: "rs0"
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          PRIMARY_HOST="mongodb-0.mongodb-headless.${POD_NAMESPACE}.svc.cluster.local:27017"
          SECONDARY_HOST="mongodb-1.mongodb-headless.${POD_NAMESPACE}.svc.cluster.local:27017"

          rm -rf /data/db/reset.lock

          mongod --replSet "${REPLICA_SET_NAME}" --bind_ip_all &
          MONGO_PID=$!

          cleanup() {
            echo "Shutting down mongod..."
            kill -TERM "${MONGO_PID}"
            wait "${MONGO_PID}"
          }
          trap cleanup SIGINT SIGTERM

          until mongosh --quiet --eval "db.adminCommand({ ping: 1 })" >/dev/null 2>&1; do
            sleep 2
          done

          if [[ "${POD_NAME}" == "mongodb-0" ]]; then
            printf 'const rsName = process.env.REPLICA_SET_NAME;\nconst primaryHost = process.env.PRIMARY_HOST;\nconst secondaryHost = process.env.SECONDARY_HOST;\nconst expectedMembers = [\n  { _id: 0, host: primaryHost, priority: 2 },\n  { _id: 1, host: secondaryHost, priority: 1 }\n];\nconst rsSettings = {\n  electionTimeoutMillis: 5000,\n  heartbeatIntervalMillis: 2000,\n  heartbeatTimeoutSecs: 10\n};\n\nfunction membersNeedUpdate(currentMembers) {\n  if (!Array.isArray(currentMembers) || currentMembers.length !== expectedMembers.length) {\n    return true;\n  }\n  for (const expected of expectedMembers) {\n    const match = currentMembers.find(member => member._id === expected._id);\n    if (!match) {\n      return true;\n    }\n    const priority = typeof match.priority === '\''number'\'' ? match.priority : 1;\n    if (match.host !== expected.host || priority !== expected.priority) {\n      return true;\n    }\n  }\n  return false;\n}\n\nfunction initReplicaSet() {\n  const existingCfg = db.getSiblingDB('\''local'\'').system.replset.findOne({ _id: rsName });\n  if (!existingCfg) {\n    print(`[rs-init] first-time initiate with members: ${tojson(expectedMembers)}`);\n    return rs.initiate({ _id: rsName, members: expectedMembers, settings: rsSettings });\n  }\n\n  print(`[rs-init] existing config detected, forcing reconfig`);\n  const nextCfg = Object.assign({}, existingCfg);\n  nextCfg.members = expectedMembers;\n  nextCfg.version = (existingCfg.version || 1) + 1;\n  if (!nextCfg.settings) nextCfg.settings = {};\n  Object.assign(nextCfg.settings, rsSettings);\n  return rs.reconfig(nextCfg, { force: true });\n}\n\nfunction ensureReplicaSet() {\n  try {\n    const status = rs.status();\n    if (membersNeedUpdate(status.members)) {\n      print('\''[rs-init] status members mismatch, reconfiguring'\'');\n      initReplicaSet();\n    } else {\n      print('\''[rs-init] replica set already configured as expected'\'');\n    }\n  } catch (err) {\n    if (err.codeName === '\''NotYetInitialized'\'' || err.codeName === '\''NodeNotFound'\'') {\n      print(`[rs-init] status error ${err.codeName}, reconfiguring`);\n      initReplicaSet();\n    } else if (err.codeName === '\''AlreadyInitialized'\'') {\n      print('\''[rs-init] previous state detected, reconfiguring'\'');\n      initReplicaSet();\n    } else {\n      throw err;\n    }\n  }\n}\n\nensureReplicaSet();\n' > /tmp/rs-init.js

            PRIMARY_HOST="${PRIMARY_HOST}" SECONDARY_HOST="${SECONDARY_HOST}" REPLICA_SET_NAME="${REPLICA_SET_NAME}" \
            mongosh --quiet --file /tmp/rs-init.js || true

            until mongosh --quiet --eval "rs.status()" >/dev/null 2>&1; do
              sleep 2
            done
            mongosh --quiet --eval "rs.awaitPrimary();" || true
          else
            # mongodb-1: PRIMARY에 연결 시도 (타임아웃: 30초)
            PRIMARY_CONNECTED=false
            for i in {1..15}; do
              if mongosh --quiet --host "${PRIMARY_HOST}" --eval "db.adminCommand({ ping: 1 })" >/dev/null 2>&1; then
                PRIMARY_CONNECTED=true
                echo "Connected to primary"
                break
              fi
              echo "Waiting for primary connection... ($i/15)"
              sleep 2
            done
            
            if [ "$PRIMARY_CONNECTED" = "false" ]; then
              echo "Warning: Could not connect to primary, but continuing..."
              echo "MongoDB will wait for Replica Set configuration from PRIMARY"
            fi
          fi

          wait "${MONGO_PID}"
        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
  volumeClaimTemplates:
  - metadata:
      name: mongodb-storage
    spec:
      storageClassName: hostpath
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

