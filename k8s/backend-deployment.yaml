apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Harbor 레지스트리 인증
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: backend
        image: 192.168.0.208/proj/backend:1.3
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8000"
        - name: MONGO_URI
          value: "mongodb://mongodb-0.mongodb-headless.dev:27017,mongodb-1.mongodb-headless.dev:27017/jobsdb?replicaSet=rs0"
        - name: JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: jwt-secret
        - name: FRONTEND_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: frontend-origin
        - name: ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: allowed-origins
        - name: WORK24_KEY
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: work24-key
        - name: WORK24_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: work24-base-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3

