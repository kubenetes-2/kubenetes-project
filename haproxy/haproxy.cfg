global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 3000ms
    timeout client 50000ms
    timeout server 30000ms
    option forwardfor
    option http-server-close
    option redispatch
    retries 2

# ==============================================================================
# Kubernetes API Server 로드밸런싱
# ==============================================================================
# Control Plane 노드들의 API 서버(포트 6443)에 대한 로드밸런싱
# Worker 노드와 외부 클라이언트가 사용
# ==============================================================================
frontend kube-apiserver
    bind *:6443
    mode tcp
    option tcplog
    default_backend kube-apiserver-backend

backend kube-apiserver-backend
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check expect string ok
    # 마스터 노드 3개에 대한 로드밸런싱
    # 클러스터 내부 IP 사용 (192.168.56.101-103)
    server master1 192.168.56.101:6443 check inter 3s fall 3 rise 3
    server master2 192.168.56.102:6443 check inter 3s fall 3 rise 3
    server master3 192.168.56.103:6443 check inter 3s fall 3 rise 3

# ==============================================================================
# Frontend 애플리케이션 로드밸런싱 (NodePort 30300)
# ==============================================================================
# 외부 클라이언트가 접근하는 프론트엔드 서비스
# 모든 노드(마스터 + 워커)에 대해 로드밸런싱
# ==============================================================================
frontend frontend-app
    bind *:80
    mode http
    option httplog
    # 헤더에 실제 호스트 추가 (선택사항)
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    default_backend frontend-backend

backend frontend-backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    timeout check 3s
    # 워커 노드만 사용 (Frontend Pod는 워커 노드에 배치됨)
    # node3은 NotReady 상태이므로 제외
    server node1 192.168.56.104:30300 check inter 5s fall 3 rise 2
    server node2 192.168.56.105:30300 check inter 5s fall 3 rise 2
    server node4 192.168.56.107:30300 check inter 5s fall 3 rise 2
    server node5 192.168.56.108:30300 check inter 5s fall 3 rise 2

# ==============================================================================
# Backend API 서버 로드밸런싱 (NodePort 30080)
# ==============================================================================
# 외부에서 API를 직접 호출할 때 사용
# 모든 노드(마스터 + 워커)에 대해 로드밸런싱
# ==============================================================================
frontend backend-api
    bind *:8080
    mode http
    option httplog
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    default_backend backend-api-backend

backend backend-api-backend
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    timeout check 3s
    # 워커 노드만 사용 (Backend Pod는 워커 노드에 배치됨)
    # node3은 NotReady 상태이므로 제외
    server node1 192.168.56.104:30080 check inter 5s fall 3 rise 2
    server node2 192.168.56.105:30080 check inter 5s fall 3 rise 2
    server node4 192.168.56.107:30080 check inter 5s fall 3 rise 2
    server node5 192.168.56.108:30080 check inter 5s fall 3 rise 2

# ==============================================================================
# Grafana 로드밸런싱 (NodePort 30330)
# ==============================================================================
# 모니터링 대시보드 접근
# http://192.168.0.204:30330 또는 http://<HAProxy_IP>:30330
# ==============================================================================
frontend grafana
    bind *:30330
    mode http
    option httplog
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    default_backend grafana-backend

backend grafana-backend
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    timeout check 10s
    timeout connect 10s
    timeout server 30s
    # 모든 노드에서 Grafana 접근 가능 (NodePort)
    # Frontend/Backend와 동일한 노드 IP 사용
    server node1 192.168.56.104:30330 check inter 10s fall 3 rise 2
    server node2 192.168.56.105:30330 check inter 10s fall 3 rise 2
    server node4 192.168.56.107:30330 check inter 10s fall 3 rise 2
    server node5 192.168.56.108:30330 check inter 10s fall 3 rise 2

# ==============================================================================
# Prometheus 로드밸런싱 (NodePort 30909)
# ==============================================================================
# 메트릭 수집 서버 접근
# http://192.168.0.204:30909 또는 http://<HAProxy_IP>:30909
# ==============================================================================
frontend prometheus
    bind *:30909
    mode http
    option httplog
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    default_backend prometheus-backend

backend prometheus-backend
    mode http
    balance roundrobin
    option httpchk GET /-/ready
    http-check expect status 200
    timeout check 3s
    # 모든 노드에서 Prometheus 접근 가능 (NodePort)
    server node1 192.168.56.104:30909 check inter 5s fall 3 rise 2
    server node2 192.168.56.105:30909 check inter 5s fall 3 rise 2
    server node4 192.168.56.107:30909 check inter 5s fall 3 rise 2
    server node5 192.168.56.108:30909 check inter 5s fall 3 rise 2

# ==============================================================================
# HAProxy 통계 페이지 (모니터링)
# ==============================================================================
# http://192.168.56.112:8404/stats 접속 시 통계 확인 가능
# ==============================================================================
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
    # stats auth admin:password  # 필요시 인증 활성화 (주석 해제)

